    function renderTable(data) {
        const tbody = document.getElementById('citations-body');
        tbody.replaceChildren();
        data.forEach(function(c) {
            const tr = document.createElement('tr');
            const publisherCell = document.createElement('td');
            publisherCell.className = 'col-publisher';
            publisherCell.textContent = c.publisher;
            tr.appendChild(publisherCell);
            const authorsCell = document.createElement('td');
            authorsCell.className = 'col-authors';
            authorsCell.textContent = c.authors;
            tr.appendChild(authorsCell);
            const titleCell = document.createElement('td');
            titleCell.className = 'col-title';
            if (c.url) {
                const link = document.createElement('a');
                link.href = c.url;
                link.target = '_blank';
                link.rel = 'noopener';
                link.textContent = c.title;
                titleCell.appendChild(link);
            } else {
                titleCell.textContent = c.title;
            }
            if (c.type) {
                const label = document.createElement('span');
                label.className = 'entry-type';
                label.textContent = c.type;
                titleCell.appendChild(label);
            }
            tr.appendChild(titleCell);
            const yearCell = document.createElement('td');
            yearCell.className = 'col-year';
            yearCell.textContent = c.year == null ? '—' : c.year;
            tr.appendChild(yearCell);
            tbody.appendChild(tr);
        });
    }

    let currentSort = { col: null, dir: 'asc' };

    function sortTable(col, type) {
        const headers = document.querySelectorAll('th');
        headers.forEach(function(h) {
            h.classList.remove('sorted-asc', 'sorted-desc');
        });

        if (currentSort.col === col) {
            currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
        } else {
            currentSort.col = col;
            currentSort.dir = 'asc';
        }

        const clickedHeader = document.querySelector('th[data-col="' + col + '"]');
        clickedHeader.classList.add(currentSort.dir === 'asc' ? 'sorted-asc' : 'sorted-desc');

        const sorted = citations.slice().sort(function(a, b) {
            let valA = a[col];
            let valB = b[col];

            if (valA === null || valA === undefined) valA = type === 'number' ? -1 : '\uffff';
            if (valB === null || valB === undefined) valB = type === 'number' ? -1 : '\uffff';

            if (type === 'number') {
                return currentSort.dir === 'asc' ? valA - valB : valB - valA;
            } else {
                valA = String(valA).toLowerCase();
                valB = String(valB).toLowerCase();
                if (valA < valB) return currentSort.dir === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.dir === 'asc' ? 1 : -1;
                return 0;
            }
        });

        renderTable(sorted);
    }

    document.querySelectorAll('th.sortable').forEach(function(th) {
        th.addEventListener('click', function() {
            sortTable(th.dataset.col, th.dataset.type);
        });
    });

    renderTable(citations);
    </script>
