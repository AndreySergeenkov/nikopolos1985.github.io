{%- assign language = page.lang | default: 'en' %}
{%- assign english_url = page.url %}
{%- if language != 'en' %}
    {%- assign english_url = page.alternate_url %}
{%- endif %}
    <link rel="alternate" hreflang="en" href="https://sergeenkov.com{{ english_url }}">
    <link rel="alternate" hreflang="ru" href="https://sergeenkov.com/ru{{ english_url }}">
    <link rel="alternate" hreflang="zh-Hans" href="https://sergeenkov.com/zh{{ english_url }}">
    <link rel="alternate" hreflang="es" href="https://sergeenkov.com/es{{ english_url }}">
    <link rel="stylesheet" href="/language.css?v=4">
    <script defer src="/language.js?v=3"></script>
